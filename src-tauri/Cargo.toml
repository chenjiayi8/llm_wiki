[package]
name = "llm-wiki"
version = "0.4.7"
description = "LLM Wiki - A personal knowledge base for LLM concepts"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "llm_wiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "llm-wiki"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-dialog = "2.7.0"
pdf-extract = "0.10.0"
tauri-plugin-store = "2.4.2"
tiny_http = "0.12"
zip = "2"
calamine = "0.34.0"
docx-rs = "0.4.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Keep unwind enabled so file-extraction panics from third-party parsers can be contained
# and returned as recoverable errors instead of terminating the desktop app.
panic = "unwind"
strip = true
